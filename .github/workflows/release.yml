name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RTK_VERSION: 0.44.1
  RTK_WINDOWS_SHA256: e9f2e26c377279c34604d81021347f8a0f16eb539ab54dd17567ab5805b2957d

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag is not supported SemVer: $env:GITHUB_REF_NAME"
          }

      - name: Install pinned RTK release
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'rtk-windows.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'rtk-bin'
          $uri = "https://github.com/rtk-ai/rtk/releases/download/v$env:RTK_VERSION/rtk-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:RTK_WINDOWS_SHA256) {
            throw "RTK archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $rtk = Get-ChildItem -LiteralPath $destination -Recurse -Filter rtk.exe -File | Select-Object -First 1
          if ($null -eq $rtk) {
            throw 'rtk.exe was not found in the release archive.'
          }
          $rtk.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\run-lint.ps1 -Bootstrap

      - name: Validate GitHub Actions workflows
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\run-actionlint.ps1 -Bootstrap

      - name: Run release test suite
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\tests\run-all.ps1

      - name: Package release
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\package-release.ps1 -Version $env:GITHUB_REF_NAME -OutputDirectory .\artifacts

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath .\artifacts -File | ForEach-Object FullName
          gh release create $tag $assets --verify-tag --generate-notes --title "RTK Codex PowerShell Hook $tag"
